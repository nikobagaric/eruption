name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libvulkan-dev libglfw3-dev glslc

    - name: Compile shaders
      run: ./compile_shaders.sh

    - name: Build project
      run: make

    - name: Check binary exists
      run: ls -la bin/tests/triangle